<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1a2e"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="280" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="400" cy="130" r="55" fill="#fbbf24" opacity="0.15"/>
  <circle cx="400" cy="130" r="38" fill="#fbbf24" opacity="0.8"/>
  <!-- Sun rays -->
  <line x1="400" y1="72" x2="400" y2="58" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="400" y1="188" x2="400" y2="202" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="342" y1="130" x2="328" y2="130" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="458" y1="130" x2="472" y2="130" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="359" y1="89" x2="349" y2="79" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="441" y1="171" x2="451" y2="181" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="441" y1="89" x2="451" y2="79" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="359" y1="171" x2="349" y2="181" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Info cards -->
  <rect x="60" y="240" width="160" height="75" rx="10" fill="#1e293b" opacity="0.9"/>
  <text x="140" y="265" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">TEMPERATURE</text>
  <text x="140" y="296" font-family="system-ui" font-size="26" fill="#fbbf24" text-anchor="middle" font-weight="700">28°C</text>

  <rect x="240" y="240" width="160" height="75" rx="10" fill="#1e293b" opacity="0.9"/>
  <text x="320" y="265" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">HUMIDITY</text>
  <text x="320" y="296" font-family="system-ui" font-size="26" fill="#14b8a6" text-anchor="middle" font-weight="700">72%</text>

  <rect x="420" y="240" width="160" height="75" rx="10" fill="#1e293b" opacity="0.9"/>
  <text x="500" y="265" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">WIND SPEED</text>
  <text x="500" y="296" font-family="system-ui" font-size="26" fill="#6366f1" text-anchor="middle" font-weight="700">14 km/h</text>

  <rect x="600" y="240" width="140" height="75" rx="10" fill="#1e293b" opacity="0.9"/>
  <text x="670" y="265" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">CONDITION</text>
  <text x="670" y="290" font-family="system-ui" font-size="14" fill="#fbbf24" text-anchor="middle">☀️ Sunny</text>

  <!-- Voice button -->
  <rect x="310" y="340" width="180" height="40" rx="20" fill="#14b8a6" opacity="0.9"/>
  <text x="400" y="366" font-family="system-ui" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600">🔊 Read Weather Aloud</text>

  <!-- Title -->
  <text x="400" y="410" font-family="system-ui" font-size="18" fill="#5eead4" text-anchor="middle" font-weight="600">Weather Voice App</text>
  <text x="400" y="432" font-family="system-ui" font-size="12" fill="#475569" text-anchor="middle">Python · Streamlit · OpenWeatherMap · Web Speech API</text>
</svg>
