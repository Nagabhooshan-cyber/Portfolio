<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Map background dots -->
  <circle cx="120" cy="180" r="3" fill="#1e3a5f" opacity="0.8"/>
  <circle cx="200" cy="140" r="3" fill="#1e3a5f" opacity="0.8"/>
  <circle cx="320" cy="200" r="3" fill="#1e3a5f" opacity="0.8"/>
  <circle cx="500" cy="160" r="3" fill="#1e3a5f" opacity="0.8"/>
  <circle cx="650" cy="220" r="3" fill="#1e3a5f" opacity="0.8"/>
  <!-- Connection lines -->
  <line x1="300" y1="220" x2="480" y2="180" stroke="#14b8a6" stroke-width="1.5" opacity="0.4" stroke-dasharray="6,4"/>
  <line x1="300" y1="220" x2="200" y2="280" stroke="#14b8a6" stroke-width="1.5" opacity="0.4" stroke-dasharray="6,4"/>
  <line x1="480" y1="180" x2="600" y2="240" stroke="#6366f1" stroke-width="1.5" opacity="0.4" stroke-dasharray="6,4"/>
  <!-- Location pins -->
  <circle cx="300" cy="220" r="18" fill="#14b8a6" opacity="0.2"/>
  <circle cx="300" cy="220" r="8" fill="#14b8a6"/>
  <circle cx="480" cy="180" r="14" fill="#6366f1" opacity="0.2"/>
  <circle cx="480" cy="180" r="6" fill="#6366f1"/>
  <circle cx="200" cy="280" r="12" fill="#14b8a6" opacity="0.2"/>
  <circle cx="200" cy="280" r="5" fill="#14b8a6" opacity="0.7"/>
  <circle cx="600" cy="240" r="12" fill="#6366f1" opacity="0.2"/>
  <circle cx="600" cy="240" r="5" fill="#6366f1" opacity="0.7"/>
  <!-- Chat bubble -->
  <rect x="480" y="100" width="140" height="55" rx="10" fill="#1e293b" stroke="#14b8a6" stroke-width="1" opacity="0.9"/>
  <text x="550" y="125" font-family="system-ui" font-size="11" fill="#5eead4" text-anchor="middle">Provider Found!</text>
  <text x="550" y="143" font-family="system-ui" font-size="10" fill="#94a3b8" text-anchor="middle">ETA: 8 minutes</text>
  <!-- Title -->
  <text x="400" y="400" font-family="system-ui" font-size="18" fill="#5eead4" text-anchor="middle" font-weight="600">FixIt: Real-Time Service Marketplace</text>
  <text x="400" y="425" font-family="system-ui" font-size="13" fill="#475569" text-anchor="middle">Full-Stack · Location-Aware</text>
</svg>
